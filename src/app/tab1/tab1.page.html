<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
     <strong class="upper_title"> Compendium </strong>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  

  <ion-item>
    <ion-select
        interface="action-sheet"
        placeholder="Kategorie..."
        (ionChange)="this.onSelectChanged($event)"
        >
      <ion-select-option
        *ngFor="let option of this.resources()" [value]="option.index"
        >{{ option.title }}</ion-select-option>
    </ion-select>
  </ion-item>



  <app-ability-score-search
    *ngIf="resource=='abilityScores'">
  </app-ability-score-search>
  <app-alignment-search
    *ngIf="resource=='alignments'">
  </app-alignment-search>
  <app-background-search
    *ngIf="resource=='backgrounds'">
  </app-background-search>
  <app-class-search
    *ngIf="resource=='classes'">
  </app-class-search>
  <app-condition-search

  </app-condition-search>
  <app-damage-type-search
    *ngIf="resource=='damageTypes'">
  </app-damage-type-search>
  <app-equipment-search
    *ngIf="resource=='equipments'">
  </app-equipment-search>

    *ngIf="resource=='equipmentCategories'">
  </app-equipment-category-search>

    *ngIf="resource=='feats'">

  </app-feature-search>
  <app-language-search

  </app-language-search>
