<form (ngSubmit)="this.onSearchSubmit(searchbar.value)">
  <ion-item>
    <ion-searchbar placeholder="Suchen..." #searchbar></ion-searchbar>
    <ion-button
      type="confirm"
      color="primary"
      expand="full"
      size="default"
      >Suchen</ion-button>
  </ion-item>
</form>


<app-search-result-list
  [loading]="this.loading"
  [error]="this.error"
  [resource]="this.resource"
  [list]="this.list"
  (entryClicked)="this.onEntryClicked($event)">
</app-search-result-list>
