<div *ngIf="this.loading">Loading...</div>
<div *ngIf="this.error">Error :(</div>
<div *ngIf="this.list">
  <ion-item *ngFor="let entry of this.list" button (click)="this.onEntryClicked(entry)">
    <ion-card style="width:100%">
      <ion-card-header>
        <ion-card-title>{{ entry.title }}</ion-card-title>
        <ion-card-subtitle *ngIf="entry.details!=''">{{ entry.details }}</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        {{ entry.description }}
      </ion-card-content>
    </ion-card>
  </ion-item>
</div>
